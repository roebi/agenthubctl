<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agenthubctl</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
  h1 { font-size: 1.1rem; color: #888; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.5rem 1rem; border-bottom: 1px solid #333; }
  .status { padding: 0.15rem 0.5rem; border-radius: 0.3rem; font-size: 0.85rem; }
  .working { background: #1e4620; color: #7fdb7f; }
  .blocked { background: #4a1e1e; color: #ff8080; }
  .idle { background: #3a3a1e; color: #e0e080; }
  .done { background: #1e3a4a; color: #80c0ff; }
  a.attach { color: #7fb0ff; text-decoration: none; }
  a.attach:hover { text-decoration: underline; }
  .no-terminal { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>agenthubctl</h1>
<table id="agents">
  <thead><tr><th>Agent</th><th>Status</th><th>Message</th><th>Updated</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<script>
// Agent names and messages are untrusted (unauthenticated POSTs), so every
// value is written with textContent, never parsed as HTML.
const REFRESH_INTERVAL_MS = 3000;
const KNOWN_STATUSES = new Set(["working", "blocked", "idle", "done"]);

function textCell(text) {
  const td = document.createElement("td");
  td.textContent = text;
  return td;
}

// Terminal URLs are fixed when the hub starts (--terminal), so each agent's
// URL is looked up once and cached; null means "no terminal configured".
const terminalUrls = new Map();

function isHttpUrl(url) {
  try {
    return ["http:", "https:"].includes(new URL(url).protocol);
  } catch {
    return false;
  }
}

async function resolveTerminal(name) {
  if (terminalUrls.has(name)) {
    return;
  }
  const res = await fetch(`/agents/${encodeURIComponent(name)}/terminal`);
  if (res.ok) {
    const { url } = await res.json();
    terminalUrls.set(name, isHttpUrl(url) ? url : null);
  } else if (res.status === 404) {
    terminalUrls.set(name, null);
  }
}

function renderRow(agent) {
  const tr = document.createElement("tr");
  tr.appendChild(textCell(agent.name));

  const statusTd = document.createElement("td");
  const badge = document.createElement("span");
  badge.className = "status";
  if (KNOWN_STATUSES.has(agent.status)) {
    badge.classList.add(agent.status);
  }
  badge.textContent = agent.status;
  statusTd.appendChild(badge);
  tr.appendChild(statusTd);

  tr.appendChild(textCell(agent.message ?? ""));
  tr.appendChild(textCell(new Date(agent.timestamp).toLocaleTimeString()));

  const attachTd = document.createElement("td");
  const url = terminalUrls.get(agent.name);
  if (url) {
    // a plain link opened by the browser itself: opening a tab from script
    // after an awaited fetch is not a user gesture and is blocked as a popup
    const link = document.createElement("a");
    link.className = "attach";
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "attach";
    attachTd.appendChild(link);
  } else {
    attachTd.className = "no-terminal";
    attachTd.textContent = "no terminal";
  }
  tr.appendChild(attachTd);
  return tr;
}

async function refresh() {
  const res = await fetch("/agents");
  if (!res.ok) {
    return;
  }
  const agents = await res.json();
  agents.sort((a, b) => a.name.localeCompare(b.name));
  await Promise.all(agents.map((agent) => resolveTerminal(agent.name)));
  document.querySelector("#agents tbody").replaceChildren(...agents.map(renderRow));
}

refresh();
setInterval(refresh, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
