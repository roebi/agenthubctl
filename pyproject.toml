[project]
name = "agenthubctl"
version = "0.1.0"
description = "Hexagonal status and terminal-attach control hub for n parallel coding agent containers."
readme = "README.md"
requires-python = "==3.14.*"
license = "MIT"
license-files = ["LICENSE"]
# lower bounds = the versions tested together (uv.lock pins the exact set)
dependencies = [
    "connexion[uvicorn]>=3.3.0",
    "pydantic>=2.14.3",
    # imported directly in api/app.py, not only via connexion
    "starlette>=1.10.0",
    "typer>=0.28.0",
]

[project.scripts]
agenthubctl = "agenthubctl.cli:app"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthubctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# the 80% gate: any run with --cov fails below it (CI included)
fail_under = 80

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
