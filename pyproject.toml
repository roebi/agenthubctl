[project]
name = "agenthubctl"
version = "0.1.0"
description = "Hexagonal status and terminal-attach control hub for n parallel coding agent containers."
requires-python = "==3.14.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "connexion[uvicorn]>=3.3.0",
    "pydantic>=2.13",
    # imported directly in api/app.py, not only via connexion
    "starlette>=1.6",
    "typer>=0.27.1",
]

[project.scripts]
agenthubctl = "agenthubctl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthubctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# the 80% gate: any run with --cov fails below it (CI included)
fail_under = 80

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
