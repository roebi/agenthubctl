<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>agenthubctl big picture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a202c"/>
    </marker>
  </defs>
  <rect width="760" height="545" fill="#ffffff"/>

  <!-- You -->
  <rect x="30" y="60" width="200" height="90" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="2"/>
  <text x="130" y="86" text-anchor="middle" font-weight="bold">You</text>
  <text x="130" y="105" text-anchor="middle">browser on your machine</text>
  <text x="130" y="128" text-anchor="middle" font-size="12">opens http://localhost:8000</text>

  <!-- Hub -->
  <rect x="300" y="20" width="440" height="200" rx="8" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="320" y="42" font-weight="bold">Hub container: agenthubctl (port 8000)</text>
  <rect x="330" y="55" width="380" height="38" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="520" y="79" text-anchor="middle">OpenAPI service: /agents, /agents/NAME/...</text>
  <rect x="330" y="105" width="380" height="38" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="520" y="129" text-anchor="middle">Dashboard page (refreshes every 3 s)</text>
  <rect x="330" y="155" width="380" height="38" rx="5" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="520" y="179" text-anchor="middle">Status store: one JSON file per agent</text>

  <!-- Agent -->
  <rect x="300" y="300" width="440" height="185" rx="8" fill="#eaf7ee" stroke="#2f855a" stroke-width="2"/>
  <text x="320" y="322" font-weight="bold">Agent container (one per agent, e.g. web-dashboard)</text>
  <rect x="330" y="340" width="380" height="50" rx="5" fill="#ffffff" stroke="#2f855a"/>
  <text x="520" y="361" text-anchor="middle">Claude Code, running inside a tmux session</text>
  <text x="520" y="379" text-anchor="middle">its hooks call hook-to-hub.sh</text>
  <rect x="330" y="410" width="380" height="50" rx="5" fill="#ffffff" stroke="#2f855a"/>
  <text x="520" y="431" text-anchor="middle">ttyd (port 7681)</text>
  <text x="520" y="449" text-anchor="middle">shows that tmux session in a browser</text>
  <line x1="520" y1="410" x2="520" y2="392" stroke="#1a202c" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow 1: status -->
  <line x1="400" y1="340" x2="400" y2="222" stroke="#1a202c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="412" y="262" font-weight="bold">1  status goes up</text>
  <text x="412" y="280" font-size="12">hook POSTs to /agents/NAME/hook</text>

  <!-- Arrow 2: dashboard -->
  <line x1="230" y1="100" x2="298" y2="100" stroke="#1a202c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="240" y="90" font-weight="bold">2</text>

  <!-- Arrow 3: attach -->
  <path d="M130,150 V435 H328" fill="none" stroke="#1a202c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="142" y="300" font-weight="bold">3  attach</text>
  <text x="142" y="318" font-size="12">browser talks to ttyd</text>
  <text x="142" y="334" font-size="12">directly (not via hub)</text>
  <text x="142" y="350" font-size="12">http://127.0.0.1:7681</text>

  <!-- Footer -->
  <text x="30" y="510" font-size="12">Agents reach the hub by name on the podman network: http://agenthubctl:8000</text>
  <text x="30" y="528" font-size="12">Your browser reaches hub and ttyd through ports published on your host.</text>
</svg>
