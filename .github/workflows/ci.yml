name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Lint (ruff)
        run: uv run ruff check src tests

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: zizmor
        run: uvx zizmor .github/workflows/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck entrypoint.sh podman_build.sh podman_run.sh

  python-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Bandit
        run: uvx bandit -r src
      - name: Semgrep
        run: uvx semgrep --config auto src

  container-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build image
        run: ./podman_build.sh ci
      - name: Save image for scanning
        run: podman save -o agenthubctl.tar agenthubctl:ci
      - name: Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (known-safe post-incident reference, not v0.36.0)
        with:
          input: agenthubctl.tar
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  dast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build and run
        run: |
          ./podman_build.sh ci
          ./podman_run.sh ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/agents && break
            sleep 1
          done
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:8000"
