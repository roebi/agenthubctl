name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Lint (ruff)
        run: uv run ruff check src tests

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck entrypoint.sh podman_build.sh podman_run.sh

  python-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Bandit
        run: uvx bandit -r src
      - name: Semgrep
        run: uvx semgrep --config auto src

  container-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build image
        run: ./podman_build.sh ci
      - name: Save image for scanning
        run: podman save -o agenthubctl.tar agenthubctl:ci
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: agenthubctl.tar
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  dast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build and run
        run: |
          ./podman_build.sh ci
          ./podman_run.sh ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/agents && break
            sleep 1
          done
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
