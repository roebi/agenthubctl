name: Release

on:
  push:
    tags:
      # Software version releases only.
      # Handover delivery tags (handover/vN) intentionally excluded
      # by this positive pattern - they never match vX.Y.Z format.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # A tag push starts this workflow independently of CI, so the tagged
  # commit is tested here before anything is published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false # release build - avoid cache poisoning risk on tag-triggered publish
      - name: Install tmux (FR-09 integration tests)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests with the coverage gate
        run: uv run pytest --cov=src --cov-report=term-missing

  # Built once; the same files go to PyPI and to the GitHub Release.
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(uv version --short)"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match pyproject.toml version ${VERSION}" >&2
            exit 1
          fi
      - name: Build distribution
        run: uv build
      - name: Keep the distribution for the publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      id-token: write # trusted publishing (OIDC) - no stored PyPI token needed
    steps:
      - name: Get the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  github-release:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write # attach files to / create the GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Get the distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attach the distribution to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Usually the release was created in the GitHub web UI together with
          # the tag: keep its description and only attach the files. Without
          # one, create it with the version's CHANGELOG.md section as notes.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            exit 0
          fi
          VERSION="${TAG#v}"
          # the "## [VERSION]" section of CHANGELOG.md, up to the next "## ["
          # or the link definitions at the end of the file
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section for ${VERSION}" >&2
            exit 1
          fi
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "${TAG}" \
            --notes-file release-notes.md

  publish-container:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build, tag, and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ./podman_build.sh "${TAG}"
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${GH_ACTOR}" --password-stdin
          podman tag agenthubctl:"${TAG}" ghcr.io/roebi/agenthubctl:"${TAG}"
          podman tag agenthubctl:"${TAG}" ghcr.io/roebi/agenthubctl:latest
          podman push ghcr.io/roebi/agenthubctl:"${TAG}"
          podman push ghcr.io/roebi/agenthubctl:latest
