name: Release

on:
  push:
    tags:
      # Software version releases only.
      # Handover delivery tags (handover/vN) intentionally excluded
      # by this positive pattern - they never match vX.Y.Z format.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing (OIDC) - no stored PyPI token needed
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Build distribution
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-container:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build, tag, and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ./podman_build.sh "${TAG}"
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag agenthubctl:"${TAG}" ghcr.io/roebi/agenthubctl:"${TAG}"
          podman tag agenthubctl:"${TAG}" ghcr.io/roebi/agenthubctl:latest
          podman push ghcr.io/roebi/agenthubctl:"${TAG}"
          podman push ghcr.io/roebi/agenthubctl:latest
