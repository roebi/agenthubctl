name: Release

on:
  push:
    tags:
      # Software version releases only.
      # Handover delivery tags (handover/vN) intentionally excluded
      # by this positive pattern - they never match vX.Y.Z format.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing (OIDC) - no stored PyPI token needed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - name: Build distribution
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist

  publish-container:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build, tag, and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ./podman_build.sh "${TAG}"
          echo "${GH_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag agenthubctl:"${TAG}" ghcr.io/roebi/agenthubctl:"${TAG}"
          podman tag agenthubctl:"${TAG}" ghcr.io/roebi/agenthubctl:latest
          podman push ghcr.io/roebi/agenthubctl:"${TAG}"
          podman push ghcr.io/roebi/agenthubctl:latest
